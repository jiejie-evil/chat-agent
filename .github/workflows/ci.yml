name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('support_agent/requirements.txt') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r support_agent/requirements.txt

      - name: Lint
        run: ruff check support_agent/

      - name: Test
        env:
          SUPPORT_AGENT_REQUIRE_API_KEY: "false"
          OPENAI_API_KEY: "sk-fake"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest support_agent/tests/ \
            --cov=support_agent \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v
