services:
  support-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-agent-api
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      SUPPORT_AGENT_DB_PATH: /app/runtime/support_agent.db
    ports:
      - "8000:8000"
    volumes:
      - support_agent_runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  support_agent_runtime:
